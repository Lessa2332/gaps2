<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ГЕО-ДЕТЕКТИВ // Посмішка = ТАК, Здивування = НІ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Fredoka+One&family=Rajdhani:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
        body { overflow:hidden; background:#060a14; font-family:'Nunito',sans-serif; color: #fff; }
        #video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; transform:scaleX(-1); }
        .heart-float { position:absolute; z-index:200; font-size:2rem; animation:floatUp 1.5s ease-out forwards; pointer-events:none; }
        @keyframes floatUp { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-100px) scale(1.5)} }
        
        /* Прості стилі для екранів та HUD (адаптуйте під ваші класи за потреби) */
        .screen { position:absolute; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(6,10,20,0.85); padding:20px; text-align:center; }
        .screen-active { display:flex !important; }
        #game-hud { position:absolute; top:20px; left:20px; right:20px; z-index:5; display:flex; justify-content:between; align-items:center; pointer-events:none; }
        #status-box { position:absolute; bottom:120px; left:20px; right:20px; z-index:5; background:rgba(13,27,62,0.9); padding:15px; border-radius:12px; border:1px solid #00d4ff; text-align:center; }
        #expr-indicator { position:absolute; bottom:30px; left:50%; transform:translateX(-50%); z-index:5; font-size:3rem; background:rgba(0,0,0,0.6); padding:10px 20px; border-radius:50px; }
        #progress-dots { position:absolute; top:80px; left:50%; transform:translateX(-50%); z-index:5; display:flex; gap:8px; }
        .pdot { width:12px; height:12px; border-radius:50%; background:rgba(255,255,255,0.3); border:1px solid rgba(0,0,0,0.5); }
        .pdot.current { background:#00d4ff; box-shadow:0 0 8px #00d4ff; }
        .pdot.done-correct { background:#00ff88; }
        .pdot.done-wrong { background:#ff3d5a; }
        #timeout-bar-container { position:absolute; top:0; left:0; right:0; height:6px; background:rgba(255,255,255,0.1); z-index:6; }
        #timeout-bar { width:100%; height:100%; background:#00d4ff; transition:width 0.1s linear; }
        #feedback-el { position:absolute; top:35%; left:50%; transform:translate(-50%,-50%); z-index:100; font-size:6rem; display:none; text-shadow:0 0 20px rgba(0,0,0,0.8); }
        #answer-hint { position:absolute; top:55%; left:50%; transform:translate(-50%,-50%); z-index:100; background:rgba(0,0,0,0.85); padding:15px 25px; border-radius:12px; max-width:80%; text-align:center; font-size:1.3rem; display:none; border:2px solid #fff; }
        .stat-box { background:rgba(255,255,255,0.05); padding:10px; border-radius:8px; text-align:center; min-width:80px; }
        .stat-box .value { font-size:1.5rem; font-weight:900; }
        .stat-box .label { font-size:0.8rem; color:rgba(255,255,255,0.6); }
        #gaps-container { margin-top:15px; text-align:left; background:rgba(255,61,90,0.1); padding:10px; border-radius:8px; border:1px solid rgba(255,61,90,0.3); }
        .gap-item { font-size:0.85rem; margin:4px 0; color:rgba(255,255,255,0.8); }
        #cert-canvas { display:none; margin-top:15px; max-width:100%; height:auto; border-radius:8px; box-shadow:0 4px 20px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline></video>
    
    <div id="timeout-bar-container"><div id="timeout-bar"></div></div>
    <div id="feedback-el"></div>
    <div id="answer-hint"></div>

    <div id="game-hud">
        <div id="hud-gr" style="color:#00d4ff; font-weight:900; font-size:1.2rem; background:rgba(6,10,20,0.7); padding:5px 15px; border-radius:20px;">ГР 1</div>
    </div>
    
    <div id="progress-dots"></div>
    
    <div id="status-box">
        <p id="status-text" style="font-size:1.1rem; font-weight:700; line-height:1.4;"></p>
    </div>
    
    <div id="expr-indicator">😐</div>
    <div id="no-face-warn" style="position:absolute; top:20px; left:50%; transform:translateX(-50%); background:#ff3d5a; color:#fff; padding:8px 16px; border-radius:20px; z-index:10; display:none; font-weight:700;">⚠️ Камера не бачить обличчя!</div>

    <div id="screen-eval" class="screen" style="display:none;">
        <h2 style="color:#00d4ff; margin-bottom:15px;">Як тобі було проходити місію?</h2>
        <div style="display:flex; gap:15px; margin-bottom:25px;">
            <button class="eval-option" style="background:#0d1b3e; color:#fff; border:2px solid #00d4ff; padding:15px; border-radius:12px; font-size:1.1rem; cursor:pointer;">💪 Легко й весело</button>
            <button class="eval-option" style="background:#0d1b3e; color:#fff; border:2px solid #ffb800; padding:15px; border-radius:12px; font-size:1.1rem; cursor:pointer;">🤔 Треба подумати</button>
            <button class="eval-option" style="background:#0d1b3e; color:#fff; border:2px solid #ff3d5a; padding:15px; border-radius:12px; font-size:1.1rem; cursor:pointer;">🆘 Було складно</button>
        </div>
        <button id="btn-submit" disabled style="background:#00ff88; color:#060a14; border:none; padding:12px 30px; border-radius:25px; font-size:1.2rem; font-weight:900; cursor:pointer;">Отримати сертифікат</button>
    </div>

    <div id="screen-result" class="screen" style="display:none; overflow-y:auto; justify-content:flex-start; padding-top:40px;">
        <div id="result-emoji" style="font-size:5rem; margin-bottom:10px;">🏆</div>
        <h1 id="rank-title" style="font-size:2rem; font-weight:900; margin-bottom:5px;"></h1>
        <p id="rank-label" style="font-size:1.2rem; color:rgba(255,255,255,0.7); margin-bottom:20px;"></p>
        
        <div id="result-stats" style="display:flex; gap:15px; margin-bottom:15px;"></div>
        <div id="gaps-container" style="width:100%; max-width:400px; margin-bottom:20px;"></div>
        
        <button id="btn-save-cert" style="background:#00d4ff; color:#060a14; border:none; padding:10px 24px; border-radius:20px; font-weight:900; cursor:pointer; font-size:1rem; margin-bottom:20px;">💾 Зберегти сертифікат на пристрій</button>
        <p id="save-status" style="font-size:0.9rem; color:#00ff88; margin-bottom:20px;"></p>
        
        <canvas id="cert-canvas"></canvas>
    </div>

    <div id="screen-lock" class="screen" style="display:none; background:#060a14;">
        <div style="font-size:4rem; margin-bottom:15px;">🔒</div>
        <h2>Місію вже виконано!</h2>
        <p style="color:rgba(255,255,255,0.6); margin-top:10px; max-width:300px;">Твій звіт та сертифікат успішно надіслано вчителю. Повторне проходження не потрібне.</p>
    </div>

    <script>
    // Глобальні змінні заглушки (ініціалізуйте у вашому головному коді або залиште логіку вікон)
    let faceLandmarker = null; 
    let video = document.getElementById('video');
    let rafId = null;
    let lastFaceLandmarks = null;
    let noFaceFrames = 0;
    const noFaceWarn = document.getElementById('no-face-warn');
    const exprIndicator = document.getElementById('expr-indicator');
    const progressDots = document.getElementById('progress-dots');
    const statusText = document.getElementById('status-text');
    const hudGr = document.getElementById('hud-gr');
    const timeoutBar = document.getElementById('timeout-bar');
    const feedbackEl = document.getElementById('feedback-el');
    const answerHint = document.getElementById('answer-hint');
    
    let currentTaskIdx = 0;
    let isWaitingForResponse = false;
    let taskStartTime = 0;
    let taskTimeoutId = null;
    const TASK_TIMEOUT_MS = 20000; // 20 секунд на питання
    
    let studentName = localStorage.getItem('geo_name') || "Агент Розумник";
    let studentClass = localStorage.getItem('geo_class') || "6-А";
    let selfEval = "";
    let finalScore = 0;
    let finalRank = null;
    
    let scores = { GR1: [], GR2: [], GR3: [] };
    const RANKS = [
        { min: 90, title: "ГЕО-МАЙСТЕР ГАЛАКТИКИ", emoji: "🌌", color: "#FFD700" },
        { min: 70, title: "СТАРШИЙ СЛІДЧИЙ ПРИРОДИ", emoji: "🕵️‍♂️", color: "#00d4ff" },
        { min: 50, title: "ШУКАЧ ТАЄМНИЦЬ", emoji: "🧭", color: "#ffb800" },
        { min: 0, title: "СТАЖЕР-КАРТОГРАФ", emoji: "🥾", color: "#ff3d5a" }
    ];
    
    const SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE"; // Вставте сюди свій URL веб-додатка Google Таблиць
    
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
        const sc = document.getElementById(id);
        if(sc) sc.style.display = 'flex';
    }
    function stopCamera() { if(video.srcObject) { video.srcObject.getTracks().forEach(t => t.stop()); } }
    function playSound(type) { /* Реалізація звуків аудіоконтексту */ }
    function spawnHearts(landmarks) { /* Ваша реалізація ефекту частинок */ }
    const avg = arr => arr.length ? arr.reduce((a,b)=>a+b, 0) / arr.length : 0;

    // ── Твердження (6 так / 6 ні) - Спрощені для дітей ──────────────────────────
    const TASKS = [
        { statement: "Природний комплекс — це коли повітря, вода, рослини і тварини в одному місці пов'язані між собою.", isTrue: true, gr:"GR1", gap:"Поняття ПК", explain:"Так! У природи всі компоненти товаришують і пов'язані." },
        { statement: "Географічна оболонка — це найбільший природний дім, який об'єднує всю нашу планету Земля.", isTrue: true, gr:"GR1", gap:"ГО — найбільший ПК", explain:"Так! Це найбільший комплекс, що охоплює всю Землю." },
        { statement: "Цілісність природи означає: якщо зіпсувати щось одне (наприклад, воду), то стане погано всім тваринам і рослинам.", isTrue: true, gr:"GR1", gap:"Цілісність ГО", explain:"Так! Якщо змінити один шматочок природи, зміниться все інше." },
        { statement: "Ритмічність у природі — це коли події повторюються, наприклад, як зміна дня і ніч або зими і літа.", isTrue: true, gr:"GR1", gap:"Ритмічність", explain:"Так! Природа повторює свої процеси, як годинник." },
        { statement: "Широтна зональність — це коли природа змінюється, якщо їхати від гарячого екватора до холодних полюсів.", isTrue: true, gr:"GR2", gap:"Широтна зональність", explain:"Так! Від екватора до полюсів стає холодніше, тому й зони змінюються." },
        { statement: "Секторність — це коли природа біля моря зовсім не така, як далеко вглиб материка.", isTrue: true, gr:"GR2", gap:"Секторність", explain:"Так! Біля моря повітря вологіше, а в глибині землі — сухіше." },
        { statement: "Озера, болота та гори формуються ТІЛЬКИ через погоду та дощі.", isTrue: false, gr:"GR2", gap:"Азональні ПК", explain:"Ні! Вони з'являються через рельєф та будову земної кори." },
        { statement: "Природні зони (як-от ліси чи степи) — це зовсім маленькі ділянки землі, як шкільний двір або грядка.", isTrue: false, gr:"GR2", gap:"Природні зони", explain:"Ні! Природні зони — це величезні території на карті." },
        { statement: "Які рослини ростуть у горах, зовсім НЕ залежить від висоти цих гір.", isTrue: false, gr:"GR3", gap:"Висотна поясність", explain:"Ні! Чим вищі гори — тим холодніше на верхівці й тим більше там різних поясів." },
        { statement: "Кількість різних рослинних поясів абсолютно однакова у всіх горах світу.", isTrue: false, gr:"GR3", gap:"Кількість поясів", explain:"Ні! Це залежить від висоти гори та від того, де вона стоїть — у теплих чи холодних країнах." },
        { statement: "Якщо люди зрубають ліс, то це зашкодить ТІЛЬКИ деревам.", isTrue: false, gr:"GR3", gap:"Вплив людини на ПК", explain:"Ні! Без лісу зникнуть тварини, зіпсується ґрунт і зникне вода." },
        { statement: "Міста, дороги та засіяні поля займають дуже маленьку частину території України.", isTrue: false, gr:"GR3", gap:"Антропогенні ПК", explain:"Ні! Люди змінили майже всю Україну (близько 85% землі)." }
    ];

    // Буфери для стабілізації розпізнавання емоцій
    let smileBuffer = [];
    let frownBuffer = [];
    const EMOTION_BUFFER_SIZE = 10;
    const EMOTION_CONFIRM_COUNT = 7;

    function analyzeFrame() {
        if (!faceLandmarker || video.readyState < 2) { 
            rafId = requestAnimationFrame(analyzeFrame); 
            return; 
        }
        
        const results = faceLandmarker.detectForVideo(video, performance.now());
     
        if (results.faceLandmarks?.length) {
            const face = results.faceLandmarks[0];
            lastFaceLandmarks = face; 
            noFaceFrames = 0; 
            noFaceWarn.style.display = 'none';

            let isSmiling = false;
            let isSurprisedOrFrowning = false;

            // Використовуємо blendShapes (якщо доступна нейромережа MediaPipe FaceLandmarker з емоціями)
            if (results.faceBlendshapes?.length) {
                const shapes = results.faceBlendshapes[0].categories;
                const smileLeft = shapes.find(s => s.categoryName === 'mouthSmileLeft')?.score || 0;
                const smileRight = shapes.find(s => s.categoryName === 'mouthSmileRight')?.score || 0;
                const jawOpen = shapes.find(s => s.categoryName === 'jawOpen')?.score || 0;
                const frownLeft = shapes.find(s => s.categoryName === 'mouthFrownLeft')?.score || 0;
                const frownRight = shapes.find(s => s.categoryName === 'mouthFrownRight')?.score || 0;

                // Логіка розпізнавання емоцій для дитячої міміки
                isSmiling = (smileLeft + smileRight) / 2 > 0.45;
                isSurprisedOrFrowning = (jawOpen > 0.5 && !isSmiling) || ((frownLeft + frownRight) / 2 > 0.4);
            } else {
                // Геометричний фолбек за точками FaceLandmarks (якщо блендшейпи відсутні в збірці)
                const mouthWidth = Math.hypot(face[61].x - face[291].x, face[61].y - face[291].y);
                const eyeDist = Math.hypot(face[33].x - face[263].x, face[33].y - face[263].y);
                const smileRatio = mouthWidth / eyeDist;

                const mouthHeight = Math.hypot(face[14].x - face[13].x, face[14].y - face[13].y);

                isSmiling = smileRatio > 0.78; 
                isSurprisedOrFrowning = mouthHeight > 0.065 && !isSmiling; 
            }

            // Оновлюємо емодзі-індикатор на екрані
            if (isSmiling) {
                exprIndicator.textContent = '😁';
            } else if (isSurprisedOrFrowning) {
                exprIndicator.textContent = '😮';
            } else {
                exprIndicator.textContent = '😐';
            }

            // Накопичуємо дані у буфери стабільності
            smileBuffer.push(isSmiling);
            frownBuffer.push(isSurprisedOrFrowning);
            if (smileBuffer.length > EMOTION_BUFFER_SIZE) smileBuffer.shift();
            if (frownBuffer.length > EMOTION_BUFFER_SIZE) frownBuffer.shift();

            // Спрацювання відповіді за умови утримання міміки
            if (isWaitingForResponse) {
                if (smileBuffer.filter(v => v).length >= EMOTION_CONFIRM_COUNT) {
                    smileBuffer = []; frownBuffer = [];
                    triggerAnswer(true); // Посмішка = ТАК
                    rafId = requestAnimationFrame(analyzeFrame); 
                    return;
                }
                if (frownBuffer.filter(v => v).length >= EMOTION_CONFIRM_COUNT) {
                    smileBuffer = []; frownBuffer = [];
                    triggerAnswer(false); // Здивування / Опущені губи = НІ
                    rafId = requestAnimationFrame(analyzeFrame); 
                    return;
                }
            }
        } else {
            smileBuffer = []; 
            frownBuffer = [];
            exprIndicator.textContent = '❓'; 
            noFaceFrames++;
            if (noFaceFrames > 30) noFaceWarn.style.display = 'block';
        }
        
        rafId = requestAnimationFrame(analyzeFrame);
    }
     
    // ── Завдання ──────────────────────────────────────────────────────────────────
    function buildDots() {
        progressDots.innerHTML = '';
        TASKS.forEach((_, i) => {
            const d = document.createElement('div'); 
            d.className = 'pdot'; 
            d.id = `dot-${i}`; 
            progressDots.appendChild(d);
        });
    }
    function setDot(i, cls) { 
        const d = document.getElementById(`dot-${i}`); 
        if (d) d.className = `pdot ${cls}`; 
    }
     
    function startTask(index) {
        if (index >= TASKS.length) { 
            clearTT(); 
            stopCamera(); 
            showEvalScreen(); 
            return; 
        }
        currentTaskIdx = index;
        const t = TASKS[index];
        statusText.textContent = `${index + 1}/12 · ${t.statement}`;
        hudGr.textContent = t.gr.replace('GR', 'ГР ');
        
        isWaitingForResponse = true; 
        smileBuffer = []; 
        frownBuffer = [];
        setDot(index, 'current');
        clearTT();
        
        taskStartTime = Date.now();
        taskTimeoutId = setInterval(updateBar, 100);
        
        setTimeout(() => {
            if (!isWaitingForResponse) return;
            clearTT(); 
            isWaitingForResponse = false;
            scores[t.gr].push(0); 
            setDot(index, 'done-wrong');
            showFeedback('⏱️', '#ffb800', '');
            setTimeout(() => startTask(index + 1), 1000);
        }, TASK_TIMEOUT_MS);
    }
     
    function clearTT() {
        if (taskTimeoutId) { clearInterval(taskTimeoutId); taskTimeoutId = null; }
        timeoutBar.style.width = '100%';
    }
    function updateBar() {
        const pct = Math.max(0, 100 - (Date.now() - taskStartTime) / TASK_TIMEOUT_MS * 100);
        timeoutBar.style.width = pct + '%';
        timeoutBar.style.background = pct > 40 ? '#00d4ff' : pct > 15 ? '#ffb800' : '#ff3d5a';
    }
     
    function triggerAnswer(userSaysTrue) {
        if (!isWaitingForResponse) return;
        isWaitingForResponse = false; 
        clearTT();
        
        const task = TASKS[currentTaskIdx];
        const correct = (userSaysTrue === task.isTrue);
        scores[task.gr].push(correct ? 1 : 0);
        setDot(currentTaskIdx, correct ? 'done-correct' : 'done-wrong');
        playSound(correct ? 'correct' : 'wrong');
        showFeedback(correct ? '✅' : '❌', correct ? '#00ff88' : '#ff3d5a', task.explain);
        
        if (correct && lastFaceLandmarks) spawnHearts(lastFaceLandmarks);
        
        setTimeout(() => { 
            feedbackEl.style.display = 'none'; 
            answerHint.style.display = 'none'; 
            startTask(currentTaskIdx + 1); 
        }, 1800);
    }
     
    function showFeedback(emoji, color, hint) {
        feedbackEl.textContent = emoji; 
        feedbackEl.style.color = color; 
        feedbackEl.style.display = 'block';
        if (hint) { 
            answerHint.textContent = hint; 
            answerHint.style.display = 'block'; 
        } else { 
            answerHint.style.display = 'none'; 
        }
    }
     
    // ── Eval ──────────────────────────────────────────────────────────────────────
    function showEvalScreen() {
        document.getElementById('game-hud').style.display = 'none';
        document.getElementById('status-box').style.display = 'none';
        exprIndicator.style.display = 'none';
        progressDots.style.display = 'none';
        showScreen('screen-eval');
    }
    document.querySelectorAll('.eval-option').forEach(el => {
        el.addEventListener('click', function() {
            document.querySelectorAll('.eval-option').forEach(o => o.classList.remove('selected'));
            this.classList.add('selected');
            selfEval = this.textContent.replace(/[💪🤔🆘]/g, '').trim();
            document.getElementById('btn-submit').disabled = false;
        });
    });
    document.getElementById('btn-submit').addEventListener('click', submitData);
     
    // ── Відправка + Результат ─────────────────────────────────────────────────────
    async function submitData() {
        if (!selfEval) return;
        document.getElementById('btn-submit').disabled = true;
        const gr1 = Math.round(avg(scores.GR1) * 100);
        const gr2 = Math.round(avg(scores.GR2) * 100);
        const gr3 = Math.round(avg(scores.GR3) * 100);
        finalScore = Math.round((gr1 + gr2 + gr3) / 3);
        finalRank = RANKS.find(r => finalScore >= r.min);
     
        const gaps = [];
        ['GR1', 'GR2', 'GR3'].forEach(gr => {
            const tasks = TASKS.filter(t => t.gr === gr);
            scores[gr].forEach((s, i) => { if (!s && tasks[i]) gaps.push(tasks[i].gap); });
        });
     
        const payload = { 
            studentName, 
            studentClass, 
            totalScore: finalScore, 
            scoreGR1: gr1, 
            scoreGR2: gr2, 
            scoreGR3: gr3, 
            gaps, 
            selfEvaluation: selfEval, 
            topic: 'obolonka', 
            rank: finalRank.title, 
            timestamp: new Date().toISOString() 
        };
     
        showScreen('screen-result');
        const re = document.getElementById('result-emoji');
        const rt = document.getElementById('rank-title');
        const rl = document.getElementById('rank-label');
        re.textContent = finalRank.emoji;
        rt.textContent = finalRank.title;
        rt.style.color = finalRank.color;
        rl.textContent = `Загальний результат: ${finalScore}%`;
     
        const color = v => v >= 75 ? '#00ff88' : v >= 50 ? '#ffb800' : '#ff3d5a';
        document.getElementById('result-stats').innerHTML = `
            <div class="stat-box"><div class="value" style="color:${color(gr1)}">${gr1}%</div><div class="label">ГР 1</div></div>
            <div class="stat-box"><div class="value" style="color:${color(gr2)}">${gr2}%</div><div class="label">ГР 2</div></div>
            <div class="stat-box"><div class="value" style="color:${color(gr3)}">${gr3}%</div><div class="label">ГР 3</div></div>`;
     
        const gapsHtml = gaps.length
            ? gaps.map(g => `<div class="gap-item">⚠ ${g}</div>`).join('')
            : '<div class="gap-item">✅ Всі теми засвоєно — чудово!</div>';
        document.getElementById('gaps-container').innerHTML = `<h3 style="color:#ff3d5a;margin-bottom:8px;font-size:0.9rem;">Повторити:</h3>${gapsHtml}`;
     
        // Малюємо сертифікат
        document.getElementById('cert-canvas').style.display = 'block';
        await drawCertificate({ name: studentName, cls: studentClass, score: finalScore, gr1, gr2, gr3, rank: finalRank, date: new Date(), gaps });
     
        // Зберегти сертифікат
        document.getElementById('btn-save-cert').addEventListener('click', saveCert);
     
        // Відправка
        const saveStatus = document.getElementById('save-status');
        let saved = false;
        for (let i = 1; i <= 3 && !saved; i++) {
            try {
                const res = await fetch(SCRIPT_URL, { method: 'POST', mode: 'cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload) });
                const data = await res.json();
                saved = true;
                saveStatus.textContent = data.result === 'already_exists' ? '✅ Результати вже збережено.' : '✅ Звіт надіслано вчителю!';
                if (data.result !== 'already_exists') localStorage.setItem('geo_obolonka_submitted', 'true');
            } catch (e) {
                if (i === 3) saveStatus.textContent = '⚠️ Не вдалося надіслати. Скажи вчителю.';
                else await new Promise(r => setTimeout(r, 1500));
            }
        }
    }
     
    // ── Сертифікат ────────────────────────────────────────────────────────────────
    async function drawCertificate({ name, cls, score, gr1, gr2, gr3, rank, date, gaps }) {
        const cvs = document.getElementById('cert-canvas');
        const ctx = cvs.getContext('2d');
        const W = 680, H = 960;
        cvs.width = W; cvs.height = H;
     
        // Фон — яскравий градієнт
        const bg = ctx.createLinearGradient(0, 0, W, H);
        bg.addColorStop(0, '#0d1b3e');
        bg.addColorStop(0.5, '#112244');
        bg.addColorStop(1, '#0a1628');
        ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
     
        // Зоряний фон
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        for (let i = 0; i < 120; i++) {
            const x = Math.random() * W, y = Math.random() * H;
            const r = Math.random() * 1.5 + 0.3;
            ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
        }
     
        // Зовнішня рамка
        const grad = ctx.createLinearGradient(0, 0, W, H);
        grad.addColorStop(0, '#FFD700'); grad.addColorStop(0.5, '#00d4ff'); grad.addColorStop(1, '#ff88cc');
        ctx.strokeStyle = grad; ctx.lineWidth = 8;
        roundRect(ctx, 12, 12, W - 24, H - 24, 24, false, true);
     
        // Внутрішня рамка
        ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 2;
        roundRect(ctx, 22, 22, W - 44, H - 44, 18, false, true);
     
        // Верхній блок — кольоровий банер
        const topGrad = ctx.createLinearGradient(0, 0, W, 0);
        topGrad.addColorStop(0, 'rgba(0,212,255,0.25)');
        topGrad.addColorStop(1, 'rgba(255,136,204,0.15)');
        ctx.fillStyle = topGrad;
        roundRect(ctx, 30, 30, W - 60, 160, 16, true, false);
     
        // Заголовок
        ctx.textAlign = 'center';
        ctx.fillStyle = '#00d4ff';
        ctx.font = 'bold 18px "IBM Plex Mono", monospace';
        ctx.fillText('ГЕО-ДЕТЕКТИВ • СЕКТОР 8', W / 2, 78);
     
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 38px "Fredoka One", "Nunito", sans-serif';
        ctx.fillText('СЕРТИФІКАТ АГЕНТА', W / 2, 130);
     
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.font = '15px "IBM Plex Mono", monospace';
        ctx.fillText('ОПЕРАЦІЯ «ГЕО-ОБОЛОНКА»', W / 2, 168);
     
      // --- Заміна текстового емодзі на стабільну векторну зірку ---
ctx.save();
ctx.translate(W / 2, 240); // Центруємо зірку на місці колишнього емодзі
ctx.fillStyle = rank.color; // Використовуємо колір поточного рангу (золотий, зелений тощо)
ctx.beginPath();
// Малюємо 5-кінцеву зірку
const spikes = 5;
const outerRadius = 45;
const innerRadius = 20;
let rot = Math.PI / 2 * 3;
let cx = 0, cy = 0;
let step = Math.PI / spikes;

ctx.moveTo(0, 0 - outerRadius);
for (let i = 0; i < spikes; i++) {
    cx = Math.cos(rot) * outerRadius;
    cy = Math.sin(rot) * outerRadius;
    ctx.lineTo(cx, cy);
    rot += step;

    cx = Math.cos(rot) * innerRadius;
    cy = Math.sin(rot) * innerRadius;
    ctx.lineTo(cx, cy);
    rot += step;
}
ctx.lineTo(0, 0 - outerRadius);
ctx.closePath();
ctx.shadowColor = rank.color;
ctx.shadowBlur = 15; // Додаємо легке неонове світіння в колір рангу
ctx.fill();
ctx.restore();
// -------------------------------------------------------------
        // Звання
        ctx.fillStyle = rank.color;
        ctx.font = 'bold 46px "Fredoka One", "Nunito", sans-serif';
        ctx.fillText(rank.title, W / 2, 370);
     
        // Ім'я
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 32px "Nunito", sans-serif';
        ctx.fillText(name, W / 2, 430);
     
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.font = '18px "Nunito", sans-serif';
        ctx.fillText(`Клас: ${cls}`, W / 2, 462);
     
        // Розділова лінія
        ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(60, 486); ctx.lineTo(W - 60, 486); ctx.stroke();
     
        // Результати по групах
        const barY = 510, barH = 52, barsX = 60, barsW = W - 120;
        const grData = [{ label: 'ГР 1', v: gr1 }, { label: 'ГР 2', v: gr2 }, { label: 'ГР 3', v: gr3 }];
        const barW = Math.floor(barsW / 3) - 16;
        grData.forEach((g, i) => {
            const bx = barsX + i * (barW + 24);
            // Фон бару
            ctx.fillStyle = 'rgba(255,255,255,0.08)';
            roundRect(ctx, bx, barY, barW, barH, 10, true, false);
            // Заповнення
            const fillW = Math.round(barW * (g.v / 100));
            const fc = g.v >= 75 ? '#00ff88' : g.v >= 50 ? '#ffb800' : '#ff3d5a';
            ctx.fillStyle = fc;
            roundRect(ctx, bx, barY, fillW, barH, 10, true, false);
            // Текст
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 20px "Nunito", sans-serif';
            ctx.fillText(`${g.label}: ${g.v}%`, bx + barW / 2, barY + barH / 2 + 7);
        });
     
        // Загальний бал — велика плашка
        const totalY = 590;
        const totalGrad = ctx.createLinearGradient(100, totalY, W - 100, totalY);
        totalGrad.addColorStop(0, 'rgba(0,212,255,0.2)');
        totalGrad.addColorStop(1, 'rgba(255,136,204,0.2)');
        ctx.fillStyle = totalGrad;
        roundRect(ctx, 100, totalY, W - 200, 72, 16, true, false);
        ctx.strokeStyle = 'rgba(0,212,255,0.4)'; ctx.lineWidth = 1.5;
        roundRect(ctx, 100, totalY, W - 200, 72, 16, false, true);
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 17px "IBM Plex Mono",monospace';
        ctx.fillText('ЗАГАЛЬНИЙ РЕЗУЛЬТАТ', W / 2, totalY+26);
        ctx.fillStyle = rank.color; ctx.font = 'bold 36px "Fredoka One","Nunito",sans-serif';
        ctx.fillText(`${score}%`, W / 2, totalY + 60);
     
        // Теми для повторення
        const gapY = 690;
        ctx.fillStyle = 'rgba(255,61,90,0.12)';
        roundRect(ctx, 50, gapY, W - 100, gaps.length ? gaps.length * 30 + 48 : 60, 14, true, false);
        ctx.strokeStyle = 'rgba(255,61,90,0.35)'; ctx.lineWidth = 1;
        roundRect(ctx, 50, gapY, W - 100, gaps.length ? gaps.length * 30 + 48 : 60, 14, false, true);
        ctx.fillStyle = '#ff3d5a'; ctx.font = 'bold 15px "Nunito",sans-serif';
        ctx.textAlign = 'left'; ctx.fillText('Теми для повторення:', 70, gapY + 26);
        if (gaps.length) {
            gaps.forEach((g, i) => {
                ctx.fillStyle = 'rgba(255,255,255,0.65)'; ctx.font = '13px "Nunito",sans-serif';
                ctx.fillText(`⚠ ${g}`, 80, gapY + 52 + i * 28);
            });
        } else {
            ctx.fillStyle = '#00ff88'; ctx.font = 'bold 14px "Nunito",sans-serif';
            ctx.fillText('✅ Всі теми засвоєно! Відмінна робота!', 70, gapY + 46);
        }
     
        // ── Печатка розробника / вчителя ───────────────────────────────────────────
        const stampX = W / 2, stampY = H - 170, stampR = 80;
        ctx.save();
        ctx.globalAlpha = 0.88;
        // Зовнішнє кільце
        ctx.strokeStyle = '#00d4ff'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(stampX, stampY, stampR, 0, Math.PI * 2); ctx.stroke();
        // Пунктирне внутрішнє кільце
        ctx.strokeStyle = 'rgba(0,212,255,0.5)'; ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 4]);
        ctx.beginPath(); ctx.arc(stampX, stampY, stampR - 10, 0, Math.PI * 2); ctx.stroke();
        ctx.setLineDash([]);
        // Текст по колу — верх
        ctx.fillStyle = '#00d4ff'; ctx.font = 'bold 13px "IBM Plex Mono",monospace'; ctx.textAlign = 'center';
        const topText = 'ВЧИТЕЛЬ ГЕОГРАФІЇ •';
        const topR = stampR - 22, topStart = -Math.PI * 0.85;
        drawArcText(ctx, topText, stampX, stampY, topR, topStart, true);
        // Текст по колу — низ
        const botText = 'ПЕРЕВІРЕНО ✓';
        drawArcText(ctx, botText, stampX, stampY, topR, Math.PI * 0.1, true);
        // Зірка посередині
        drawStar(ctx, stampX, stampY - 6, 5, 22, 10, '#00d4ff');
        // Повноважне ім'я
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 13px "Nunito",sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('Олесі Олександрівни', stampX, stampY + 26);
        ctx.restore();
     
        // Дата
        ctx.textAlign = 'center';
        const d = date;
        const dateStr = `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.${d.getFullYear()}`;
        ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.font = '14px "IBM Plex Mono",monospace';
        ctx.fillText(dateStr, W / 2, H - 54);
        ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.font = '11px "IBM Plex Mono",monospace';
        ctx.fillText('гра.освіта.ua • ГЕО-ДЕТЕКТИВ 2025', W / 2, H - 34);
    }
     
    // Допоміжні функції canvas
    function roundRect(ctx, x, y, w, h, r, fill, stroke) {
        ctx.beginPath();
        ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
        if (fill) ctx.fill();
        if (stroke) ctx.stroke();
    }
     
    function drawArcText(ctx, text, cx, cy, r, startAngle, clockwise) {
        const total = text.length;
        const step = (clockwise ? 1 : -1) * Math.PI * 1.35 / Math.max(total, 1);
        for (let i = 0; i < total; i++) {
            const angle = startAngle + i * step;
            ctx.save();
            ctx.translate(cx + r * Math.cos(angle), cy + r * Math.sin(angle));
            ctx.rotate(angle + Math.PI / 2);
            ctx.fillText(text[i], 0, 0);
            ctx.restore();
        }
    }
     
    function drawStar(ctx, cx, cy, spikes, outerR, innerR, color) {
        ctx.beginPath(); ctx.fillStyle = color;
        let rot = Math.PI / 2 * 3;
        const step = Math.PI / spikes;
        ctx.moveTo(cx, cy - outerR);
        for (let i = 0; i < spikes; i++) {
            ctx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR); rot += step;
            ctx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR); rot += step;
        }
        ctx.lineTo(cx, cy - outerR); ctx.closePath(); ctx.fill();
    }
     
    function saveCert() {
        const cvs = document.getElementById('cert-canvas');
        const link = document.createElement('a');
        link.download = `geo-agent-${studentName.replace(/\s+/g, '-')}.png`;
        link.href = cvs.toDataURL('image/png');
        link.click();
    }
     
    // ── Блокування ────────────────────────────────────────────────────────────────
    if (localStorage.getItem('geo_obolonka_submitted') === 'true') {
        showScreen('screen-lock');
    } else {
        // Запуск логіки (коли ваші моделі завантажено, викликайте buildDots() та startTask(0))
        buildDots();
        // Для старту розкоментуйте запуск циклу аналізу:
        // startTask(0);
        // rafId = requestAnimationFrame(analyzeFrame);
    }
     
    </script>
