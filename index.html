<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ГЕО-ДЕТЕКТИВ // Сектор 8: Міміка</title>
    <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Rajdhani:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { overflow: hidden; background: #060a14; font-family: 'Nunito', sans-serif; }

        #video {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 0; transform: scaleX(-1);
        }
        #canvas {
            position: absolute; inset: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
        }

        .hud {
            position: absolute; top: 16px; left: 16px; right: 16px; z-index: 150;
            display: flex; justify-content: space-between; align-items: center;
            pointer-events: none;
        }
        .hud-logo {
            font-family: 'Rajdhani', sans-serif; font-size: 18px; font-weight: 700;
            color: #00d4ff; text-shadow: 0 0 15px rgba(0,212,255,0.5);
        }
        .hud-badge {
            background: rgba(0,212,255,0.12); border: 1px solid rgba(0,212,255,0.25);
            color: #00d4ff; padding: 6px 14px; border-radius: 20px;
            font-family: 'IBM Plex Mono', monospace; font-size: 12px;
        }

        #status-box {
            position: absolute; bottom: 36px; left: 50%; transform: translateX(-50%);
            z-index: 100; width: 88%; max-width: 480px;
            background: rgba(6,10,20,0.9); border: 1px solid #1e3a5f;
            border-radius: 24px; padding: 18px; text-align: center;
            backdrop-filter: blur(12px);
        }
        #status-text {
            font-size: 1.3rem; font-weight: 700; color: #e2eaff; margin-bottom: 8px;
        }
        #instruction {
            font-size: 0.9rem; color: #ffb800; font-weight: 600;
        }

        #feedback {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 4rem; z-index: 200; display: none; text-shadow: 0 0 20px currentColor;
        }

        #start-screen, #eval-screen, #result-screen {
            position: fixed; inset: 0; z-index: 3000;
            background: rgba(6,10,20,0.95); backdrop-filter: blur(10px);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
            color: #e2eaff; text-align: center; padding: 20px;
        }
        #start-screen { display: flex; }
        #eval-screen, #result-screen { display: none; }

        .btn {
            background: #00d4ff; color: #060a14; border: none;
            padding: 16px 40px; border-radius: 14px;
            font-size: 1.4rem; font-weight: 700; cursor: pointer;
            font-family: 'Rajdhani', sans-serif; text-transform: uppercase;
            transition: transform 0.15s;
        }
        .btn:active { transform: scale(0.95); }

        .eval-option {
            background: rgba(255,255,255,0.05); border: 1px solid #1e3a5f;
            border-radius: 12px; padding: 14px 20px; width: 80%; max-width: 320px;
            cursor: pointer; text-align: left; font-size: 1rem;
        }
        .eval-option.selected { border-color: #00d4ff; background: rgba(0,212,255,0.1); }

        .result-stat {
            display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; width: 80%;
        }
        .stat-box {
            background: rgba(17,29,53,0.8); border: 1px solid #1e3a5f;
            border-radius: 12px; padding: 12px; text-align: center;
        }
        .stat-box .value { font-size: 2rem; font-weight: 700; }
        .stat-box .label { font-size: 0.75rem; color: #5a7399; }

        .gaps-box {
            background: rgba(255,61,90,0.1); border: 1px solid rgba(255,61,90,0.3);
            border-radius: 14px; padding: 16px; text-align: left; width: 90%; max-width: 400px;
        }
        .gap-item { padding: 6px 0; border-bottom: 1px solid #1e3a5f; color: #d0a0a8; font-size: 0.9rem; }
        .gap-item:last-child { border-bottom: none; }
    </style>
</head>
<body>

    <div class="hud">
        <div class="hud-logo">ГЕО-ДЕТЕКТИВ</div>
        <div class="hud-badge" id="hud-gr">СЕКТОР 8</div>
    </div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div id="status-box">
        <div id="status-text">Завантаження...</div>
        <div id="instruction">Посміхнись 😊 = Так, Відкрий рот 😮 = Ні</div>
    </div>
    <div id="feedback"></div>

    <!-- Стартовий екран -->
    <div id="start-screen">
        <div style="font-size: 4rem">😊😮</div>
        <h1 style="font-family:'Rajdhani';">Операція «ГЕО-ОБОЛОНКА»</h1>
        <p>Відповідай на 12 завдань мімікою:</p>
        <p style="color:#00ff88;">Посміхнись = Правильно (Так)</p>
        <p style="color:#ff3d5a;">Відкрий рот = Неправильно (Ні)</p>
        <button class="btn" id="btn-start">РОЗПОЧАТИ МІСІЮ</button>
    </div>

    <!-- Екран самооцінки (після всіх завдань) -->
    <div id="eval-screen">
        <h2 style="font-family:'Rajdhani';">ЗВІТ АГЕНТА</h2>
        <p>12 завдань виконано. Оціни свій рівень:</p>
        <div class="eval-option" onclick="selectEval(this, 'Впевнено')">Впевнено</div>
        <div class="eval-option" onclick="selectEval(this, 'Частково')">Частково</div>
        <div class="eval-option" onclick="selectEval(this, 'Потребую підтримки')">Потребую підтримки</div>
        <button class="btn" id="btn-submit" disabled>НАДІСЛАТИ ЗВІТ</button>
    </div>

    <!-- Екран результатів -->
    <div id="result-screen">
        <div class="result-stat" id="result-stats">...</div>
        <div class="gaps-box" id="gaps-container"></div>
        <button class="btn" onclick="location.reload()">ЗАВЕРШИТИ</button>
    </div>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.skypack.dev/@mediapipe/tasks-vision@0.10.3";

// ========== КОНСТАНТИ ==========
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwUCjrOlZuUGPrGzauifB6v-qoVT9arKkCKlXZxiQSgYvDlFJyO7jg0BEe_OtHrKfEDXg/exec";

const TASKS = [
    // ГР1
    { statement: "Літосфера — це тверда оболонка Землі.", isTrue: true, gr: "GR1", gap: "ГР1_Поняття_географічної_оболонки" },
    { statement: "Цілісність означає, що природа — єдиний організм.", isTrue: true, gr: "GR1", gap: "ГР1_Цілісність_ГО" },
    { statement: "Ритмічність — це закономірність, яка пов'язує всі сфери.", isTrue: false, gr: "GR1", gap: "ГР1_Закономірності_ГО" },
    { statement: "До природного комплексу входять гірські породи, клімат, води, ґрунти і живі організми.", isTrue: true, gr: "GR1", gap: "ГР1_Компоненти_ПК" },
    { statement: "Материк Євразія — це найменший природний комплекс.", isTrue: false, gr: "GR1", gap: "ГР1_Зміна_ПК" },
    // ГР2
    { statement: "Головна причина природних зон — зміна співвідношення тепла і вологи.", isTrue: true, gr: "GR2", gap: "ГР2_Причина_зональності" },
    { statement: "В Африці зони змінюються від екватора на північ і південь — це прояв висотної поясності.", isTrue: false, gr: "GR2", gap: "ГР2_Аналіз_карти_зон" },
    { statement: "Правильний порядок зон від полюса до екватора: Арктичні пустелі → Тундра → Тайга → Степи → Тропічні пустелі → Екваторіальні ліси.", isTrue: true, gr: "GR2", gap: "ГР2_Читання_карти_зон" },
    { statement: "Океанічні течії та гори не впливають на природні зони.", isTrue: false, gr: "GR2", gap: "ГР2_Порушення_зональності" },
    // ГР3
    { statement: "Зміна природи в горах із висотою називається широтною зональністю.", isTrue: false, gr: "GR3", gap: "ГР3_Висотна_поясність" },
    { statement: "Кількість висотних поясів залежить від висоти гори та її близькості до екватора.", isTrue: true, gr: "GR3", gap: "ГР3_Залежність_висотної_поясності" },
    { statement: "Осушення боліт на Поліссі призведе до зниження ґрунтових вод, зникнення птахів і посух.", isTrue: true, gr: "GR3", gap: "ГР3_Трансформація_комплексів" }
];

// ========== СТАН ==========
let faceLandmarker;
let video, statusText, instructionEl, feedbackEl, hudGr;
let currentTaskIdx = 0;
let scores = { GR1: [], GR2: [], GR3: [] };
let selfEval = "";
let deviceToken = localStorage.getItem('geo_dev_token') || 'dev_' + Math.random().toString(36).substr(2,9);
localStorage.setItem('geo_dev_token', deviceToken);

// Мімічний буфер
let expressionBuffer = [];
let confirmCounter = 0;
let isWaitingForResponse = false;
const EXPRESSION_NEUTRAL = 'neutral';
const EXPRESSION_SMILE = 'smile';
const EXPRESSION_OPEN_MOUTH = 'open_mouth';
const BUFFER_SIZE = 20;
const CONFIRM_THRESHOLD = 15; // кадрів утримання

// ========== DOM ==========
video = document.getElementById('video');
statusText = document.getElementById('status-text');
instructionEl = document.getElementById('instruction');
feedbackEl = document.getElementById('feedback');
hudGr = document.getElementById('hud-gr');

// ========== ІНІЦІАЛІЗАЦІЯ ==========
document.getElementById('btn-start').addEventListener('click', async () => {
    document.getElementById('start-screen').style.display = 'none';
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        video.srcObject = stream;
        await initFaceAI();
        startTask(0);
    } catch (e) {
        alert("Потрібен доступ до камери! " + e.message);
    }
});

async function initFaceAI() {
    const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
    faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
            delegate: "GPU"
        },
        runningMode: "VIDEO",
        numFaces: 1
    });
    // Запускаємо цикл аналізу
    requestAnimationFrame(analyzeFrame);
}

function analyzeFrame() {
    if (!faceLandmarker || !video.readyState) {
        requestAnimationFrame(analyzeFrame);
        return;
    }
    const results = faceLandmarker.detectForVideo(video, performance.now());
    if (results.faceLandmarks && results.faceLandmarks.length > 0) {
        const face = results.faceLandmarks[0];
        const expr = detectExpression(face);
        updateExpressionBuffer(expr);
    } else {
        // Немає обличчя – скидаємо буфер
        expressionBuffer = [];
        confirmCounter = 0;
    }
    requestAnimationFrame(analyzeFrame);
}

// ========== РОЗПІЗНАВАННЯ МІМІКИ ==========
function detectExpression(landmarks) {
    // Точки губ (індекси з MediaPipe Face Landmarker)
    const upperLip = landmarks[13];   // верхня губа (центр)
    const lowerLip = landmarks[14];   // нижня губа (центр)
    const leftCorner = landmarks[61]; // лівий кут рота
    const rightCorner = landmarks[291]; // правий кут рота

    const mouthWidth = Math.hypot(rightCorner.x - leftCorner.x, rightCorner.y - leftCorner.y);
    const mouthHeight = Math.hypot(lowerLip.x - upperLip.x, lowerLip.y - upperLip.y);

    // Відношення ширини до висоти
    const ratio = mouthWidth / (mouthHeight + 0.001); // уникаємо ділення на нуль

    // Пороги (підібрані емпірично)
    if (mouthHeight > 0.08 && ratio < 2.5) {
        return EXPRESSION_OPEN_MOUTH; // широко відкритий рот
    } else if (ratio > 3.5 && mouthWidth > 0.25) {
        return EXPRESSION_SMILE; // широка посмішка
    }
    return EXPRESSION_NEUTRAL;
}

function updateExpressionBuffer(expr) {
    expressionBuffer.push(expr);
    if (expressionBuffer.length > BUFFER_SIZE) expressionBuffer.shift();

    // Визначаємо домінуючий вираз
    const counts = { neutral: 0, smile: 0, open_mouth: 0 };
    expressionBuffer.forEach(e => counts[e]++);
    const dominant = counts.smile > counts.open_mouth ? EXPRESSION_SMILE : 
                     counts.open_mouth > counts.neutral ? EXPRESSION_OPEN_MOUTH : EXPRESSION_NEUTRAL;

    if (dominant === EXPRESSION_SMILE || dominant === EXPRESSION_OPEN_MOUTH) {
        confirmCounter++;
        if (confirmCounter >= CONFIRM_THRESHOLD && isWaitingForResponse) {
            handleAnswer(dominant === EXPRESSION_SMILE); // true = Так (посмішка)
            isWaitingForResponse = false;
            confirmCounter = 0;
        }
    } else {
        confirmCounter = 0;
    }
}

// ========== УПРАВЛІННЯ ЗАВДАННЯМИ ==========
function startTask(index) {
    if (index >= TASKS.length) {
        showEvalScreen();
        return;
    }
    currentTaskIdx = index;
    const task = TASKS[index];
    statusText.textContent = `Твердження: ${task.statement}`;
    instructionEl.textContent = "Посміхнись 😊 = Так, Відкрий рот 😮 = Ні";
    hudGr.textContent = task.gr.replace('GR', 'ГР ');
    isWaitingForResponse = true;
    expressionBuffer = [];
    confirmCounter = 0;
}

function handleAnswer(userSaysTrue) {
    const task = TASKS[currentTaskIdx];
    const correct = (userSaysTrue === task.isTrue);
    // Зберігаємо бал
    scores[task.gr].push(correct ? 1 : 0);

    // Показуємо зворотний зв'язок
    feedbackEl.style.display = 'block';
    feedbackEl.textContent = correct ? '✅' : '❌';
    feedbackEl.style.color = correct ? '#00ff88' : '#ff3d5a';
    setTimeout(() => {
        feedbackEl.style.display = 'none';
        startTask(currentTaskIdx + 1);
    }, 1000);
}

// ========== ЕКРАН САМООЦІНКИ ==========
function showEvalScreen() {
    video.pause();
    document.getElementById('status-box').style.display = 'none';
    document.getElementById('eval-screen').style.display = 'flex';
    window.selectEval = function(el, val) {
        document.querySelectorAll('.eval-option').forEach(o => o.classList.remove('selected'));
        el.classList.add('selected');
        selfEval = val;
        document.getElementById('btn-submit').disabled = false;
        document.getElementById('btn-submit').onclick = submitData;
    };
}

// ========== ВІДПРАВКА В GOOGLE ТАБЛИЦЮ ==========
async function submitData() {
    if (!selfEval) return;
    const gr1pct = Math.round(avg(scores.GR1) * 100);
    const gr2pct = Math.round(avg(scores.GR2) * 100);
    const gr3pct = Math.round(avg(scores.GR3) * 100);
    const totalPct = Math.round((gr1pct + gr2pct + gr3pct) / 3);

    const gaps = [];
    const gapMap = {
        GR1: scores.GR1.map((v,i) => ({ s: v, g: TASKS[i].gap })),
        GR2: scores.GR2.map((v,i) => ({ s: v, g: TASKS[i+5].gap })),
        GR3: scores.GR3.map((v,i) => ({ s: v, g: TASKS[i+9].gap }))
    };
    [...gapMap.GR1, ...gapMap.GR2, ...gapMap.GR3].forEach(e => { if (!e.s) gaps.push(e.g); });

    const payload = {
        studentName: localStorage.getItem('student_name') || 'Анонім',
        studentClass: localStorage.getItem('student_class') || '7-?',
        totalScore: totalPct,
        scoreGR1: gr1pct,
        scoreGR2: gr2pct,
        scoreGR3: gr3pct,
        gaps,
        selfEvaluation: selfEval,
        deviceToken,
        topic: 'obolonka'
    };

    // Показуємо результат
    document.getElementById('eval-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'flex';
    const statsHtml = `
        <div class="stat-box"><div class="value" style="color:${color(gr1pct)}">${gr1pct}%</div><div class="label">ГР 1</div></div>
        <div class="stat-box"><div class="value" style="color:${color(gr2pct)}">${gr2pct}%</div><div class="label">ГР 2</div></div>
        <div class="stat-box"><div class="value" style="color:${color(gr3pct)}">${gr3pct}%</div><div class="label">ГР 3</div></div>
    `;
    document.getElementById('result-stats').innerHTML = statsHtml;
    const gapsHtml = gaps.length ? gaps.map(g => `<div class="gap-item">⚠ ${g}</div>`).join('') : '<div class="gap-item">Всі теми засвоєно!</div>';
    document.getElementById('gaps-container').innerHTML = `<h3 style="color:#ff3d5a; margin-bottom:8px;">Прогалини:</h3>${gapsHtml}`;

    // Відправка на сервер
    try {
        const res = await fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.result === 'already_exists') {
            alert('Ваші результати вже збережено.');
        } else {
            localStorage.setItem('geo_obolonka_submitted', 'true');
        }
    } catch (e) {
        console.error(e);
    }
}

function avg(arr) { return arr.length ? arr.reduce((a,b) => a + b, 0) / arr.length : 0; }
function color(v) { return v >= 75 ? '#00ff88' : v >= 50 ? '#ffb800' : '#ff3d5a'; }

</script>
</body>
</html>
